version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentlens-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentlens}
      POSTGRES_DB: ${POSTGRES_DB:-agentlens}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentlens"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentlens-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend service (to be configured in later phases)
